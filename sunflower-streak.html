<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflower — a daily watering ritual</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --sky-top:#122a42;
    --sky-mid:#3c5470;
    --sky-bottom:#f2a65a;
    --paper:#fbf3e3;
    --paper-2:#f4ead4;
    --ink:#26301f;
    --ink-soft:#5b6350;
    --gold:#d9a441;
    --gold-deep:#b97e2a;
    --leaf-dark:#24462b;
    --leaf:#3f7247;
    --soil:#4a3323;
    --pot:#b5602f;
    --pot-dark:#8f4a24;
    --shadow: 0 18px 40px -14px rgba(20,20,10,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Quicksand', sans-serif;
    background: var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow: var(--shadow);
  }

  /* ---------- HERO / SCENE ---------- */
  .hero{
    position:relative;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    padding: 28px 24px 0;
    overflow:hidden;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(255,244,224,0.75);
    margin:0 0 6px;
  }
  h1.headline{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px, 6vw, 32px);
    line-height:1.15;
    color:#fdf6ea;
    margin:0 0 18px;
    max-width:280px;
  }

  .sun{
    position:absolute;
    top:34px; right:38px;
    width:46px;height:46px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe9b0, #f5b64a 70%);
    box-shadow:0 0 40px 12px rgba(255,204,120,0.45);
  }
  @media (prefers-reduced-motion: no-preference){
    .sun{ animation: sunpulse 6s ease-in-out infinite; }
    .cloud{ animation: drift 40s linear infinite; }
    .cloud.c2{ animation-duration:55s; animation-delay:-20s; }
    .sway{ animation: sway 5.5s ease-in-out infinite; transform-origin: 200px 430px; }
  }
  @keyframes sunpulse{ 0%,100%{ transform:scale(1); opacity:1;} 50%{ transform:scale(1.08); opacity:0.9;} }
  @keyframes drift{ from{ transform:translateX(-10%);} to{ transform:translateX(120%);} }
  @keyframes sway{ 0%,100%{ transform:rotate(-1.1deg);} 50%{ transform:rotate(1.1deg);} }

  .cloud{
    position:absolute;
    width:120px;height:34px;
    background:rgba(255,255,255,0.25);
    border-radius:40px;
    filter:blur(1px);
  }
  .cloud.c1{ top:70px; left:-40px; }
  .cloud.c2{ top:118px; left:-80px; width:90px; height:26px; background:rgba(255,255,255,0.16);}

  .scene-wrap{
    position:relative;
    margin-top:6px;
  }
  svg#sceneSvg{ display:block; width:100%; height:auto; }

  .ground{ fill:#274b34; }

  /* soil */
  .soil{ fill:var(--soil); transition: fill 0.5s ease; }
  .soil.wet{ fill:#2c1c11; }

  /* stems */
  .stem{
    fill:none;
    stroke:var(--leaf);
    stroke-width:5;
    stroke-linecap:round;
  }
  #stemMain{ stroke:var(--leaf-dark); stroke-width:6; }

  /* leaves / bud / sepals / petals / disc / daisies : inner animatable groups */
  .leaf, .bud, .sepal, .petal, .center-disc, .daisy{
    opacity:0;
    transform:scale(0.15);
    transition: transform 0.85s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
  }
  .leaf.visible, .bud.visible, .sepal.visible, .petal.visible, .center-disc.visible, .daisy.visible{
    opacity:1; transform:scale(1);
  }
  .leaf{ fill:var(--leaf); }
  .leaf.dark{ fill:var(--leaf-dark); }
  .bud{ fill:var(--leaf-dark); }
  .sepal{ fill:var(--leaf); }
  .petal{ fill:url(#petalGrad); }
  .center-disc-core{ fill:url(#discGrad); }

  @media (prefers-reduced-motion: reduce){
    .leaf,.bud,.sepal,.petal,.center-disc,.daisy{ transition-duration:.01s; }
  }

  .droplet{ fill:#8fd3e8; opacity:0.9; }
  .ripple{
    fill:none; stroke:#cfe8b8; stroke-width:2; opacity:0.7;
    transform-origin:200px 430px;
  }

  /* watering can */
  .can-wrap{
    position:absolute;
    left:50%; top:64px;
    transform:translateX(-64px);
    transition: transform 1.1s cubic-bezier(.4,0,.2,1);
    transform-origin: 86% 90%;
    cursor:pointer;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
  }
  .can-wrap.pour{ transform:translateX(-64px) rotate(-38deg); }

  /* ---------- PAPER / CONTENT ---------- */
  .content{
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    padding: 22px 24px 34px;
    position:relative;
  }
  .divider-curve{ display:block; width:100%; height:26px; margin-top:-2px; }

  .quote-card{
    text-align:center;
    padding: 6px 8px 22px;
  }
  .quote-mark{
    font-family:'Fraunces', serif;
    font-size:34px;
    color:var(--gold-deep);
    line-height:1;
    margin-bottom:2px;
  }
  #quoteText{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:19px;
    line-height:1.5;
    color:var(--ink);
    transition:opacity .35s ease, transform .35s ease;
    min-height:56px;
  }
  #quoteText.fade-out{ opacity:0; transform:translateY(4px); }

  .stats-row{
    display:flex;
    align-items:stretch;
    gap:12px;
    background:#fff9ec;
    border:1px solid #ecdcb8;
    border-radius:20px;
    padding:18px 20px;
    box-shadow: 0 10px 26px -16px rgba(80,55,10,0.35);
  }
  .streak-block{ flex:0 0 auto; text-align:center; padding-right:16px; border-right:1px solid #ecdcb8; }
  #streakNum{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:38px;
    color:var(--gold-deep);
    display:block;
    transition: transform .2s ease;
  }
  #streakNum.pop{ animation: pop .5s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 35%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .streak-label{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-top:2px;
  }
  .stage-block{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  #stageLabel{ font-weight:600; font-size:15px; color:var(--ink); }
  .sub-stats{ font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono', monospace; }

  .water-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%;
    margin-top:18px;
    padding:16px 20px;
    border:none;
    border-radius:999px;
    background: linear-gradient(180deg, #e8b356, var(--gold-deep));
    color:#3a2508;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    box-shadow: 0 14px 28px -12px rgba(185,126,42,0.65), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .water-btn:hover{ transform:translateY(-2px); }
  .water-btn:active{ transform:translateY(1px) scale(0.99); }
  .water-btn:focus-visible{ outline:3px solid #274b34; outline-offset:3px; }
  .water-btn.done{ background:linear-gradient(180deg,#cfead0,#a9d3ab); color:#274b34; }

  .toast{
    position:fixed;
    left:50%; bottom:22px;
    transform:translate(-50%, 20px);
    max-width:440px;
    width:calc(100% - 48px);
    background:#274b34;
    color:#f2ead2;
    padding:14px 18px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.4;
    opacity:0;
    pointer-events:none;
    transition: opacity .35s ease, transform .35s ease;
    box-shadow:0 16px 32px -12px rgba(0,0,0,0.4);
    z-index:20;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }

  .badges{
    display:flex; justify-content:space-between;
    margin-top:26px;
    padding:0 4px;
  }
  .badge{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:#b9ac8e;
  }
  .badge .dot{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#efe4c8; border:2px solid #e2d3a9;
    font-size:14px;
  }
  .badge.unlocked .dot{
    background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold-deep));
    border-color:var(--gold-deep);
  }
  .badge.unlocked{ color:var(--gold-deep); font-weight:700; }

  .sparkle{
    position:absolute;
    pointer-events:none;
    font-size:16px;
    opacity:1;
  }
  @media (prefers-reduced-motion: no-preference){
    .sparkle{ animation: sparkle-fly .9s ease-out forwards; }
  }
  @keyframes sparkle-fly{
    to{ transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(180deg); opacity:0; }
  }

  .reset-banner{
    font-size:12.5px;
    color:var(--ink-soft);
    background:#efe4c8;
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    text-align:center;
    display:none;
  }
  .reset-banner.show{ display:block; }

  .visually-hidden{
    position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0 0 0 0);
  }
</style>
</head>
<body>
<div class="app">

  <section class="hero">
    <p class="eyebrow" id="dateLine">Today</p>
    <h1 class="headline">Grow a little,<br>every day.</h1>
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="scene-wrap">
      <svg id="sceneSvg" viewBox="0 0 400 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A sunflower growing in a terracotta pot, surrounded by daisies">
        <defs>
          <linearGradient id="petalGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#e08a1e"/>
            <stop offset="55%" stop-color="#ffcf4d"/>
            <stop offset="100%" stop-color="#fff2c2"/>
          </linearGradient>
          <radialGradient id="discGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#8a5a2f"/>
            <stop offset="70%" stop-color="#5f3c20"/>
            <stop offset="100%" stop-color="#432a17"/>
          </radialGradient>
          <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c96a34"/>
            <stop offset="100%" stop-color="#8f4a24"/>
          </linearGradient>
        </defs>

        <!-- ground -->
        <rect class="ground" x="0" y="418" width="400" height="52"/>

        <g class="sway" id="plantGroup">
          <!-- stems (paths drawn bottom->top, animated via stroke-dashoffset) -->
          <path id="stemLeft" class="stem" d="M188,428 C176,392 170,340 167,278"/>
          <path id="stemRight" class="stem" d="M212,428 C224,392 230,340 233,278"/>
          <path id="stemMain" class="stem" d="M200,428 C197,360 202,250 200,148"/>

          <!-- leaves -->
          <g transform="translate(196,347) rotate(150) scale(1.15)">
            <g class="leaf dark" data-appear="4" style="transform-origin:0px 0px">
              <path d="M0,0 C10,-15 32,-15 44,0 C32,7 10,7 0,0 Z"/>
            </g>
          </g>
          <g transform="translate(206,238) rotate(-24) scale(1.05)">
            <g class="leaf" data-appear="4" style="transform-origin:0px 0px">
              <path d="M0,0 C10,-15 32,-15 44,0 C32,7 10,7 0,0 Z"/>
            </g>
          </g>
          <g transform="translate(172,315) rotate(160) scale(0.9)">
            <g class="leaf" data-appear="5" style="transform-origin:0px 0px">
              <path d="M0,0 C9,-13 28,-13 38,0 C28,6 9,6 0,0 Z"/>
            </g>
          </g>
          <g transform="translate(228,315) rotate(-18) scale(0.9)">
            <g class="leaf dark" data-appear="6" style="transform-origin:0px 0px">
              <path d="M0,0 C9,-13 28,-13 38,0 C28,6 9,6 0,0 Z"/>
            </g>
          </g>

          <!-- bud -->
          <g class="bud" data-appear="6" style="transform-origin:200px 150px">
            <circle cx="200" cy="150" r="17"/>
          </g>

          <!-- sepals (5) -->
          <g transform="rotate(0 200 150)"><g class="sepal" data-appear="7" style="transform-origin:200px 150px"><path d="M200,150 L191,118 L209,118 Z"/></g></g>
          <g transform="rotate(72 200 150)"><g class="sepal" data-appear="7" style="transform-origin:200px 150px"><path d="M200,150 L191,118 L209,118 Z"/></g></g>
          <g transform="rotate(144 200 150)"><g class="sepal" data-appear="7" style="transform-origin:200px 150px"><path d="M200,150 L191,118 L209,118 Z"/></g></g>
          <g transform="rotate(216 200 150)"><g class="sepal" data-appear="7" style="transform-origin:200px 150px"><path d="M200,150 L191,118 L209,118 Z"/></g></g>
          <g transform="rotate(288 200 150)"><g class="sepal" data-appear="7" style="transform-origin:200px 150px"><path d="M200,150 L191,118 L209,118 Z"/></g></g>

          <!-- 8 petals, clockwise, one per stage from 8 to 15 -->
          <g transform="rotate(0 200 150)"><g class="petal" data-appear="8" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>
          <g transform="rotate(45 200 150)"><g class="petal" data-appear="9" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>
          <g transform="rotate(90 200 150)"><g class="petal" data-appear="10" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>
          <g transform="rotate(135 200 150)"><g class="petal" data-appear="11" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>
          <g transform="rotate(180 200 150)"><g class="petal" data-appear="12" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>
          <g transform="rotate(225 200 150)"><g class="petal" data-appear="13" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>
          <g transform="rotate(270 200 150)"><g class="petal" data-appear="14" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>
          <g transform="rotate(315 200 150)"><g class="petal" data-appear="15" style="transform-origin:200px 150px"><path d="M200,150 C185,140 181,100 200,66 C219,100 215,140 200,150 Z"/></g></g>

          <!-- center disc, on top of petals -->
          <g class="center-disc" data-appear="7" style="transform-origin:200px 150px">
            <circle class="center-disc-core" cx="200" cy="150" r="26"/>
          </g>
        </g>

        <!-- soil -->
        <ellipse class="soil" id="soilEllipse" cx="200" cy="426" rx="80" ry="12"/>

        <!-- pot -->
        <path d="M126,428 L152,502 C152,510 248,510 248,502 L274,428 Z" fill="url(#potGrad)"/>
        <ellipse cx="200" cy="428" rx="76" ry="13" fill="#a75830"/>
        <rect x="118" y="418" width="164" height="16" rx="8" fill="#c96a34"/>

        <!-- daisies flanking the pot -->
        <g transform="translate(96,412) scale(0.62)">
          <g class="daisy" data-appear="0" style="transform-origin:0px 0px">
            <g fill="#ffffff">
              <ellipse cx="0" cy="-20" rx="7" ry="14"/>
              <ellipse cx="0" cy="20" rx="7" ry="14"/>
              <ellipse cx="20" cy="0" rx="14" ry="7"/>
              <ellipse cx="-20" cy="0" rx="14" ry="7"/>
              <ellipse cx="14" cy="-14" rx="8" ry="14" transform="rotate(45 14 -14)"/>
              <ellipse cx="-14" cy="14" rx="8" ry="14" transform="rotate(45 -14 14)"/>
              <ellipse cx="14" cy="14" rx="8" ry="14" transform="rotate(-45 14 14)"/>
              <ellipse cx="-14" cy="-14" rx="8" ry="14" transform="rotate(-45 -14 -14)"/>
            </g>
            <circle cx="0" cy="0" r="10" fill="#f3b94c"/>
            <path d="M0,20 L-4,44 L4,44 Z" fill="var(--leaf)"/>
          </g>
        </g>
        <g transform="translate(308,418) scale(0.5)">
          <g class="daisy" data-appear="0" style="transform-origin:0px 0px">
            <g fill="#ffffff">
              <ellipse cx="0" cy="-20" rx="7" ry="14"/>
              <ellipse cx="0" cy="20" rx="7" ry="14"/>
              <ellipse cx="20" cy="0" rx="14" ry="7"/>
              <ellipse cx="-20" cy="0" rx="14" ry="7"/>
              <ellipse cx="14" cy="-14" rx="8" ry="14" transform="rotate(45 14 -14)"/>
              <ellipse cx="-14" cy="14" rx="8" ry="14" transform="rotate(45 -14 14)"/>
              <ellipse cx="14" cy="14" rx="8" ry="14" transform="rotate(-45 14 14)"/>
              <ellipse cx="-14" cy="-14" rx="8" ry="14" transform="rotate(-45 -14 -14)"/>
            </g>
            <circle cx="0" cy="0" r="10" fill="#f3b94c"/>
            <path d="M0,20 L-4,44 L4,44 Z" fill="var(--leaf)"/>
          </g>
        </g>
      </svg>

      <div class="can-wrap" id="wateringCan" role="button" tabindex="0" aria-label="Water the sunflower">
        <svg width="90" height="70" viewBox="0 0 90 70">
          <path d="M18,30 h34 a10,10 0 0 1 10,10 v6 a10,10 0 0 1 -10,10 h-34 a8,8 0 0 1 -8,-8 v-10 a8,8 0 0 1 8,-8 Z" fill="#3c6b8a"/>
          <path d="M62,34 L86,22" stroke="#3c6b8a" stroke-width="7" stroke-linecap="round"/>
          <circle cx="88" cy="20" r="6" fill="#3c6b8a"/>
          <path d="M40,30 C40,18 46,12 52,12" stroke="#3c6b8a" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </section>

  <section class="content">
    <svg class="divider-curve" viewBox="0 0 400 26" preserveAspectRatio="none"><path d="M0,0 C100,26 300,26 400,0 L400,26 L0,26 Z" fill="var(--paper)"/></svg>

    <div class="reset-banner" id="resetBanner">A day slipped by, so the streak reset — but every bloom starts with a single drop. Let's grow again.</div>

    <div class="quote-card">
      <div class="quote-mark">“</div>
      <p id="quoteText" aria-live="polite">Loading today's thought…</p>
    </div>

    <div class="stats-row">
      <div class="streak-block">
        <span id="streakNum">0</span>
        <span class="streak-label">day streak</span>
      </div>
      <div class="stage-block">
        <span id="stageLabel">Soil's ready. Give it a drop.</span>
        <span class="sub-stats" id="subStats">longest 0 · total 0</span>
      </div>
    </div>

    <button class="water-btn" id="waterBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 C12 2 5 10 5 15 a7 7 0 0 0 14 0 C19 10 12 2 12 2Z" fill="#3a2508"/></svg>
      <span id="waterBtnText">Water today's sunflower</span>
    </button>

    <div class="badges" id="badges"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'sunflower-progress-v1';
  const STAGE_MAX = 15;

  const QUOTES = [
    "Small daily care outlasts big occasional effort.",
    "Nothing blooms on the day it's planted — patience is the first ingredient.",
    "The petals open in their own order. Yours will too.",
    "A single drop of water, given daily, moves mountains of soil.",
    "Growth is quiet work. Most of it happens where no one's watching.",
    "You don't need a good week. You need one good day, repeated.",
    "Roots come before flowers. Foundations always do.",
    "Consistency is a kind of quiet devotion.",
    "Every stem was once nothing more than a decision to keep going.",
    "The sun doesn't ask the flower to hurry. Neither should you.",
    "What you tend to, tends to grow.",
    "A streak isn't about perfection — it's about returning.",
    "Some days you show up for the bloom. Other days, you show up for the soil.",
    "The clockwise turn of a sunflower is just persistence, dressed as beauty.",
    "Small rituals hold surprisingly large lives together.",
    "You are allowed to grow slower than you'd like.",
    "The bud doesn't rush the bloom, and neither should you.",
    "Every leaf unfurled first as something folded and unsure.",
    "Water today. Let tomorrow worry about tomorrow.",
    "There is no such thing as wasted tending.",
    "A garden teaches what a calendar can't: everything has its season.",
    "The tallest stem still started underground, in the dark.",
    "Progress is often invisible until, suddenly, it isn't.",
    "Return to the same small act, and watch it become a life.",
    "Flowers don't compete with the flower next to them. Neither should you.",
    "One drop of attention a day is enough to keep something alive.",
    "The most reliable growth is the boring, daily kind.",
    "You're not behind. You're exactly as grown as your care has allowed.",
    "Even the fullest bloom began as a stem no one noticed.",
    "Keep watering. The bloom is not the point — the tending is.",
    "A missed day isn't a failure, it's just weather. Plant again.",
    "The quiet plants are usually the ones about to surprise you.",
    "What repeats, remains.",
    "Turn toward the light, even in small degrees, every day.",
    "The soil doesn't judge how late you arrive with the water.",
    "Some growth is measured in inches. Some in mornings kept.",
    "You cannot rush a sunflower, and you cannot rush yourself.",
    "The bloom always looks sudden from the outside.",
    "Tending something daily is how you learn to trust yourself again.",
    "Today's single drop is tomorrow's whole flower."
  ];

  const STAGE_CAPTIONS = [
    "Soil's ready. Give it a drop.",
    "First stem breaking through.",
    "A second stem rises.",
    "Three stems, standing tall.",
    "First leaves unfurling.",
    "Leaves filling in nicely.",
    "Full height — a bud is forming.",
    "The bud is opening.",
    "Petal one, facing the sun.",
    "Petals turning clockwise.",
    "A quarter bloomed.",
    "Gold is spreading.",
    "More than halfway there.",
    "Almost fully open.",
    "One petal from full bloom.",
    "Full bloom. Gorgeous."
  ];

  const MILESTONES = [7,14,30,60,100];

  let state = { streak:0, totalWaters:0, longestStreak:0, lastWateredDate:null };
  let lastQuoteIndex = -1;

  const $ = (id)=>document.getElementById(id);

  function todayStr(d){
    d = d || new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function addDays(dateStr, n){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return todayStr(d);
  }

  async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ /* first visit, or storage blocked */ }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Could not save progress', e); }
}

  function seededIndex(dateStr, len){
    let h = 0;
    for(const c of dateStr){ h = (h*31 + c.charCodeAt(0)) >>> 0; }
    return h % len;
  }

  function showQuote(index, animate){
    const el = $('quoteText');
    const text = QUOTES[index];
    if(animate){
      el.classList.add('fade-out');
      setTimeout(()=>{ el.textContent = text; el.classList.remove('fade-out'); }, 320);
    } else {
      el.textContent = text;
    }
    lastQuoteIndex = index;
  }
  function newRandomQuote(){
    if(QUOTES.length<=1){ showQuote(0,true); return; }
    let idx;
    do{ idx = Math.floor(Math.random()*QUOTES.length); } while(idx===lastQuoteIndex);
    showQuote(idx, true);
  }

  function fractionsForStage(stage){
    return {
      main: stage>=6 ? 1 : (stage>=1 ? 0.42 : 0),
      left: stage>=6 ? 1 : (stage>=2 ? 0.38 : 0),
      right: stage>=6 ? 1 : (stage>=3 ? 0.38 : 0)
    };
  }

  const stemLens = {};
  function initStemPaths(){
    ['stemMain','stemLeft','stemRight'].forEach(id=>{
      const p = $(id);
      const len = p.getTotalLength();
      stemLens[id] = len;
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });
  }
  function setStemProgress(id, fraction, animate){
    const p = $(id);
    const len = stemLens[id];
    p.style.transition = animate ? 'stroke-dashoffset 1.2s cubic-bezier(.4,.7,.3,1)' : 'none';
    p.style.strokeDashoffset = Math.max(0, len * (1 - fraction));
  }

  function applyStage(stage, animate){
    stage = Math.min(stage, STAGE_MAX);
    const f = fractionsForStage(stage);
    setStemProgress('stemMain', f.main, animate);
    setStemProgress('stemLeft', f.left, animate);
    setStemProgress('stemRight', f.right, animate);

    document.querySelectorAll('[data-appear]').forEach(el=>{
      const s = +el.dataset.appear;
      const shouldShow = stage >= s;
      const already = el.classList.contains('visible');
      if(shouldShow && !already) el.classList.add('visible');
      else if(!shouldShow && already) el.classList.remove('visible');
    });

    const label = state.streak > STAGE_MAX
      ? 'Full bloom, day ' + state.streak + '.'
      : STAGE_CAPTIONS[stage];
    $('stageLabel').textContent = label;
  }

  function updateStatsUI(){
    $('streakNum').textContent = state.streak;
    $('subStats').textContent = 'longest ' + state.longestStreak + ' · total ' + state.totalWaters;
    renderBadges();
  }

  function popStreakNumber(){
    const el = $('streakNum');
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }

  function renderBadges(){
    const wrap = $('badges');
    wrap.innerHTML = '';
    MILESTONES.forEach(m=>{
      const unlocked = state.longestStreak >= m;
      const b = document.createElement('div');
      b.className = 'badge' + (unlocked ? ' unlocked' : '');
      b.title = unlocked ? (m + '-day streak reached') : (m + '-day streak — locked');
      b.innerHTML = '<div class="dot">' + (unlocked ? '✓' : '') + '</div><span>' + m + 'd</span>';
      wrap.appendChild(b);
    });
  }

  function showToast(msg, ms){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), ms || 3200);
  }

  function soilRipple(){
    const soil = $('soilEllipse');
    soil.classList.add('wet');
    setTimeout(()=> soil.classList.remove('wet'), 1400);

    const svg = $('sceneSvg');
    const ns = 'http://www.w3.org/2000/svg';
    const r = document.createElementNS(ns,'ellipse');
    r.setAttribute('cx','200'); r.setAttribute('cy','426');
    r.setAttribute('rx','20'); r.setAttribute('ry','5');
    r.setAttribute('class','ripple');
    svg.insertBefore(r, soil);
    let scale = 1;
    const start = performance.now();
    function step(t){
      const p = Math.min(1, (t-start)/900);
      scale = 1 + p*3.2;
      r.style.transform = 'scale(' + scale + ')';
      r.style.opacity = String(0.7*(1-p));
      if(p<1) requestAnimationFrame(step); else r.remove();
    }
    requestAnimationFrame(step);
  }

  function spawnDroplets(count){
    const svg = $('sceneSvg');
    const ns = 'http://www.w3.org/2000/svg';
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        const d = document.createElementNS(ns,'circle');
        const startX = 148 + Math.random()*8;
        d.setAttribute('cx', startX);
        d.setAttribute('cy', 92);
        d.setAttribute('r', 3.5);
        d.setAttribute('class','droplet');
        d.style.transition = 'transform .75s cubic-bezier(.55,0,1,.45), opacity .75s ease';
        svg.appendChild(d);
        requestAnimationFrame(()=>{
          const dx = (Math.random()*24-12);
          d.style.transform = 'translate(' + dx + 'px, 332px)';
          d.style.opacity = '0.1';
        });
        setTimeout(()=> d.remove(), 850);
      }, i*95);
    }
  }

  function celebrate(big){
    const wrap = document.querySelector('.scene-wrap');
    const rect = wrap.getBoundingClientRect();
    const originX = big ? rect.width*0.5 : rect.width*0.5;
    const originY = big ? rect.height*0.36 : rect.height*0.86;
    const n = big ? 14 : 6;
    for(let i=0;i<n;i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = big ? (Math.random()<0.5?'✨':'🌟') : '✦';
      s.style.left = originX + 'px';
      s.style.top = originY + 'px';
      s.style.color = big ? '#e8b356' : '#cfe8b8';
      const angle = Math.random()*Math.PI*2;
      const dist = 40 + Math.random()*70;
      s.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      wrap.appendChild(s);
      setTimeout(()=> s.remove(), 950);
    }
  }

  function playPour(willGrow, targetStage){
    const can = $('wateringCan');
    can.classList.add('pour');
    spawnDroplets(6);
    setTimeout(()=> soilRipple(), 680);
    setTimeout(()=> can.classList.remove('pour'), 1350);

    if(willGrow){
      setTimeout(()=>{
        applyStage(targetStage, true);
        updateStatsUI();
        popStreakNumber();
        celebrate(targetStage>=8);
        newRandomQuote();
      }, 780);
    }
  }

  async function waterPlant(){
    const today = todayStr();
    if(state.lastWateredDate === today){
      playPour(false);
      showToast("Already watered today — your sunflower is happy. Come back tomorrow. 🌻");
      return;
    }
    const yesterday = addDays(today, -1);
    state.streak = (state.lastWateredDate === yesterday) ? state.streak + 1 : 1;
    state.totalWaters += 1;
    state.longestStreak = Math.max(state.longestStreak, state.streak);
    state.lastWateredDate = today;

    playPour(true, state.streak);
    await saveState();
    setBtnState();
  }

  function setBtnState(){
    const btn = $('waterBtn');
    const txt = $('waterBtnText');
    const today = todayStr();
    if(state.lastWateredDate === today){
      btn.classList.add('done');
      txt.textContent = "Watered today · come back tomorrow";
    } else {
      btn.classList.remove('done');
      txt.textContent = "Water today's sunflower";
    }
  }

  function setDateLine(){
    const d = new Date();
    $('dateLine').textContent = d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }

  async function init(){
    setDateLine();
    await loadState();

    const today = todayStr();
    let missedReset = false;
    if(state.lastWateredDate && state.lastWateredDate !== today){
      const yesterday = addDays(today, -1);
      if(state.lastWateredDate !== yesterday){
        if(state.streak > 0) missedReset = true;
        state.streak = 0;
      }
    }
    if(missedReset){
      $('resetBanner').classList.add('show');
      saveState();
    }

    initStemPaths();
    applyStage(Math.min(state.streak, STAGE_MAX), false);
    updateStatsUI();
    setBtnState();
    showQuote(seededIndex(today, QUOTES.length), false);

    const can = $('wateringCan');
    can.addEventListener('click', waterPlant);
    can.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); waterPlant(); } });
    $('waterBtn').addEventListener('click', waterPlant);
  }

  init();
})();
</script>
</body>
</html>
